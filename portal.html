<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Portal de Entretenimento Digital</title>
    
    <link rel="stylesheet" href="reset.css">
    <link rel="stylesheet" href="estilo.css">

    <style>
        /* O CSS Interno vai controlar a cor de fundo geral e a fonte base */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212; /* Fundo escuro estilo streaming */
            color: #ffffff;
            padding: 20px;
        }
        .main-title {
            text-align: center;
            margin-bottom: 30px;
            color: #00ff88; /* Verde tecnológico */
        }
    </style>
</head>
<body>

    <h1 class="main-title" style="text-shadow: 2px 2px 8px rgba(0,255,136,0.5);">
        Meu Portal de Entretenimento Digital
    </h1>

    <main id="portal-container">

        <section class="card-secao" id="secao-filmes">
            <h2>Filmes e Séries</h2>
            <p>Análises, lançamentos e críticas do cinema e do streaming.</p>
            <img src="ponyo.webp" alt="Capa de Filme" class="img-portal">
            <img src="naruto.jpg" alt="Capa de Série" class="img-portal">
        </section>

        <section class="card-secao" id="secao-musica">
            <h2>Música e Podcasts</h2>
            <p>Minhas playlists favoritas, episódios marcantes e novidades musicais.</p>
            <img src="selfishmachines.jpg" alt="Álbum de Música" class="img-portal">
            <img src="mic.webp" alt="Microfone de Podcast" class="img-portal">
        </section>

        <section class="card-secao" id="secao-games">
            <h2>Games e Tecnologia</h2>
            <p>Reviews de jogos, setups de PC, consoles e novidades de hardware.</p>
            <img src="controle.jpg" alt="Controle de videogame" class="img-portal">
            <img src="hardware.avif" alt="Hardware de PC" class="img-portal">
        </section>

    </main>

</body>
</html>
